services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in the root .env file}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in the root .env file}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the root .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin --protocol=TCP --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --password=\"$${MYSQL_PASSWORD}\" status >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the root .env file}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:?Set MYSQL_USER in the root .env file}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the root .env file}
      DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in the root .env file}
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["tools"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the root .env file}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:?Set MYSQL_USER in the root .env file}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the root .env file}
      DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-BizLedger Admin}
    expose:
      - "5000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  mysql_data:
